<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlitzMall — Auth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8e8;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 36px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo span {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo .blitz { color: #ff4d00; }
    .logo .mall  { color: #ffffff; }

    .tabs {
      display: flex;
      background: #111;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .tab {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: #ff4d00;
      color: #fff;
    }

    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; }

    label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 4px;
      display: block;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #ff4d00; }

    input.error { border-color: #e53e3e; }

    .field-error {
      font-size: 12px;
      color: #e53e3e;
      margin-top: 4px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #ff4d00;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover  { background: #e64400; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { background: #555; cursor: not-allowed; }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .alert.success { background: #162a1a; border: 1px solid #276749; color: #68d391; }
    .alert.fail    { background: #2a1616; border: 1px solid #742a2a; color: #fc8181; }

    .token-box {
      display: none;
      margin-top: 20px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px;
    }

    .token-box p {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .token-value {
      font-size: 11px;
      color: #ccc;
      word-break: break-all;
      font-family: monospace;
      line-height: 1.5;
    }

    .user-info {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .badge {
      background: #1e2a1e;
      border: 1px solid #276749;
      color: #68d391;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="blitz">Blitz</span><span class="mall">Mall</span>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
      <div>
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>
      <div id="loginAlert" class="alert"></div>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="form" onsubmit="handleRegister(event)">
      <div>
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required />
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required />
      </div>
      <div>
        <label>Password <span style="color:#666;font-size:11px">(min 6 chars)</span></label>
        <input type="password" id="regPassword" placeholder="••••••••" required />
      </div>
      <div>
        <label>Confirm Password</label>
        <input type="password" id="regConfirm" placeholder="••••••••" required />
        <div id="confirmError" class="field-error"></div>
      </div>
      <div id="registerAlert" class="alert"></div>
      <button type="submit" id="registerBtn">Create Account</button>
    </form>

    <!-- TOKEN RESULT -->
    <div class="token-box" id="tokenBox">
      <p>Logged in as</p>
      <div class="user-info">
        <span class="badge" id="badgeName"></span>
        <span class="badge" id="badgeEmail"></span>
        <span class="badge" id="badgeRole"></span>
      </div>
      <p style="margin-top:12px">JWT Token</p>
      <div class="token-value" id="tokenValue"></div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0) === (tab === 'login'));
      });
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('registerForm').classList.toggle('active', tab === 'register');
      document.getElementById('tokenBox').style.display = 'none';
      hideAlert('loginAlert');
      hideAlert('registerAlert');
    }

    function showAlert(id, type, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = `alert ${type}`;
      el.style.display = 'block';
    }

    function hideAlert(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showResult(data) {
      document.getElementById('badgeName').textContent = data.name;
      document.getElementById('badgeEmail').textContent = data.email;
      document.getElementById('badgeRole').textContent = data.role;
      document.getElementById('tokenValue').textContent = data.token;
      document.getElementById('tokenBox').style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      hideAlert('loginAlert');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });

        const data = await res.json();

        if (res.ok) {
          showAlert('loginAlert', 'success', 'Welcome back!');
          showResult(data);
        } else {
          showAlert('loginAlert', 'fail', data.message ?? 'Invalid credentials.');
        }
      } catch {
        showAlert('loginAlert', 'fail', 'Server error. Try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();

      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;
      const confirmEl = document.getElementById('regConfirm');
      const confirmErr = document.getElementById('confirmError');

      if (password !== confirm) {
        confirmEl.classList.add('error');
        confirmErr.textContent = 'Passwords do not match.';
        return;
      }
      confirmEl.classList.remove('error');
      confirmErr.textContent = '';

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';
      hideAlert('registerAlert');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: password,
            confirmPassword: confirm
          })
        });

        const data = await res.json();

        if (res.ok) {
          showAlert('registerAlert', 'success', 'Account created successfully!');
          showResult(data);
        } else {
          const msg = data.message ?? data.errors
            ? Object.values(data.errors).flat().join(' ')
            : 'Registration failed.';
          showAlert('registerAlert', 'fail', msg);
        }
      } catch {
        showAlert('registerAlert', 'fail', 'Server error. Try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
